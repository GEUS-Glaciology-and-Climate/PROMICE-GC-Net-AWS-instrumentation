name = "instrument_1"

# Source: FRE_2025.docx
#
# FRE_2025.docx documents the RH instrument present before the
# 2025 replacement but does not provide the original installation
# date of that instrument.
#
# Therefore, the installation date cannot currently be determined
# from the reviewed source.
installation_date = "NA"

# Source: FRE_2025.docx
#
# Maintenance sheet Date field:
#     "19 april + 28 april"
#
# RH replacement evidence:
#     HygroClip T/hum assembly
#     Shipped = Y
#     Replaced = Y
#
# Therefore, the pre-existing Rotronic/HygroClip instrument ended
# during the documented 2025 maintenance activity.
#
# The source does not specify whether the replacement happened on
# 19 April or 28 April, so the exact decommission date is unresolved.
decommission_date = "NA"

instrument_type = "Rotronic/HygroClip"
serial_number = "NA"

source_file = "FRE_2025.docx"

date_confidence = "RH replacement high confidence; exact date unresolved between 19 April and 28 April"

boundary_reason = "HygroClip T/hum assembly explicitly marked Shipped = Y and Replaced = Y in FRE_2025.docx; exact replacement date cannot be assigned to either listed maintenance date"


