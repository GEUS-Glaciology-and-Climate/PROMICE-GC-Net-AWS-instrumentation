# FRE relative-humidity instrument periods
#
# Sources reviewed:
# - FRE_2025.docx
#
# Station name in the maintenance sheet: Freya
#
# The 2025 maintenance sheet lists two maintenance dates:
# - 19 April
# - 28 April
#
# The sheet does not explicitly state which of these two dates
# corresponds to the RH instrument replacement.
#
# The AWS hardware checklist explicitly records:
#
# HygroClip T/hum assembly
#     Shipped = Y
#     Replaced = Y
#
# The same entry identifies:
#     Rotronics = Y
#     New or old type = Square plug
#
# Therefore, the 2025 maintenance record provides clear evidence
# that the Rotronic/HygroClip RH instrument was replaced.
#
# However, because the document gives two maintenance dates and does
# not associate the replacement with one specific date, the exact
# RH boundary remains unresolved.
#
# No date is guessed below.


