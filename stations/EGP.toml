# EGP relative-humidity instrument periods
#
# Sources reviewed:
# - EGP_2023.jpg
# - EGP_2023_2.jpg
# - EGP_2024.jpg
# - EGP_2024_2.jpg
# - EGP_2026.pdf
#
# The 2023 visit occurred on 2023-06-21, but the maintenance sheet
# explicitly marks the HygroClip T/humidity assembly as not replaced.
# Therefore, 2023-06-21 is not used as an RH instrument boundary.
#
# The 2024 visit on 2024-06-11 records an upgrade from PROMICE v2
# instrumentation to GC-Net AWS v4 Vaisala instrumentation.
#
# The 2026 sheet indicates Vaisala replacement activity, but the exact
# visit date is not reliably readable. The current instrument therefore
# remains open-ended until that date is confirmed.

