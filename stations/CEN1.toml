# CEN1 relative-humidity instrument periods
#
# The CEN1 Level-2 CSV begins on 2017-07-24.
#
# The additional year-wise diagnostic boundaries below were introduced
# based on overlapping structures observed in the RH-versus-temperature
# cloud plots.
#
# These dates are analytical boundaries inferred from the data.
# They are not confirmed physical instrument-change dates from
# maintenance records.

