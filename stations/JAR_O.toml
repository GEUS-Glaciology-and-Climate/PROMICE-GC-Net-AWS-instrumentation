# JAR_O relative-humidity instrument periods
#
# Sources reviewed:
# - JAR_O_2022.pdf
# - JAR_O_2024.pdf
# - JAR_2025.pdf
# - JAR_2025_2.pdf
#
# JAR_O_2022.pdf documents existing temperature/humidity
# instrumentation, but the original installation date is not
# reliably recoverable from the reviewed extraction.
#
# JAR_O_2024.pdf documents the JAR_O station and RH/T
# instrumentation, but does not provide sufficiently clear
# replacement evidence to introduce a 2024 RH boundary.
#
# The 2025 field report explicitly reports Lufft replacement
# activity at both field sites and records a JAR_O maintenance
# entry dated 2025-08-20.
#
# Therefore 2025-08-20 is used as the documented JAR_O
# RH instrument boundary.


[[sensor]]
name = "instrument_1"
installation_date = "2022-01-01"
decommission_date = "2025-08-20"
instrument_type = "Temperature/humidity assembly"
serial_number = "NA"
source_file = "JAR_O_2022.pdf; JAR_O_2024.pdf; JAR_2025.pdf; JAR_2025_2.pdf"
parsing_confidence = "filename_year_only_review_required"
boundary_reason = "Pre-2025 RH/T instrumentation retained until the documented August 2025 Lufft replacement; exact original installation date requires review"


[[sensor]]
name = "instrument_2"
installation_date = "2025-08-20"
decommission_date = "NA"
instrument_type = "Lufft"
serial_number = "NA"
source_file = "JAR_2025.pdf; JAR_2025_2.pdf"
parsing_confidence = "high"
boundary_reason = "2025 field report documents Lufft replacement activity and records the JAR_O maintenance entry dated 2025-08-20"