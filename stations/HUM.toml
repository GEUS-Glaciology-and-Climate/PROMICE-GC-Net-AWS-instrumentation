# HUM relative-humidity instrument periods
#
# Sources reviewed:
# - HUM_2022.pdf
# - HUM_2026.pdf
# - PROMICE_maintenance.xlsx
#
# HUM is documented in PROMICE maintenance metadata as a
# two-boom ice-sheet station.
#
# HUM_2022.pdf gives the maintenance date explicitly as
# 2022-06-19 and records replacement/activity for both the
# upper and lower temperature/humidity assemblies.
#
# Therefore 2022-06-19 is used as the first confirmed RH/T
# instrument boundary represented in this instrumentation file.
#
# HUM_2026.pdf was reviewed, but the available extracted text
# is not sufficiently readable to establish an exact RH/T
# replacement date. No 2026 boundary is therefore introduced.
#
# No pre-2022 RH period is represented here because an exact
# installation date for that RH instrument has not yet been
# verified from the reviewed maintenance evidence.


[[sensor]]
name = "instrument_1"
installation_date = "2022-06-19"
decommission_date = "2023-06-19"  #guess
instrument_type = "Temperature/humidity assembly"
serial_number = "NA"
source_file = "HUM_2022.pdf; HUM_2026.pdf; PROMICE_maintenance.xlsx"
parsing_confidence = "2022_boundary_high_confidence_later_boundary_unresolved"
boundary_reason = "Documented RH/T period begins at the 2022-06-19 HUM maintenance boundary; no later RH/T replacement boundary is established from the reviewed HUM_2026 extraction"


