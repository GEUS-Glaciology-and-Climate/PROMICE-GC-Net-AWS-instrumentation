# First-draft instrument database for MIT
#
# Sources reviewed:
# - maintenance sheets/MIT_2013.docx
# - maintenance sheets/MIT_2014.pdf
# - maintenance sheets/MIT_2015.pdf
# - maintenance sheets/MIT_2021.pdf
#
# 2013:
# Maintenance date = 2013-09-01.
# HygroClip replacement documented.
#
# 2014:
# Maintenance date = 2014-07-31.
# HygroClip changed from 61012684 to 61180279.
#
# 2015:
# 2015-08-11: station taken down.
# 2015-08-13: old TAS_U station installed at MIT.
#
# 2021:
# Maintenance visits = 2021-09-04 and 2021-09-07.
# HygroClip was shipped, but the source does not establish
# which exact visit date corresponds to the replacement.
#
# Therefore the 2021 dates are recorded but do not create
# a guessed RH/T boundary.

