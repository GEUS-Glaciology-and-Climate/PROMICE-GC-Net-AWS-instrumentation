# Source: MIT_2014.pdf
# Date: 31.7
# HygroClip changed to serial 61180279.
decommission_date = "2014-07-31"

instrument_type = "Rotronic/HygroClip"
serial_number = "61012684"
source_file = "maintenance sheets/MIT_2013.docx; maintenance sheets/MIT_2014.pdf"
parsing_confidence = "exact_maintenance_sheet_date"


