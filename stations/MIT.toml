# First-draft instrument database for MIT
#
# Sources reviewed:
# - maintenance sheets/MIT_2014.pdf
# - maintenance sheets/MIT_2015.pdf
# - maintenance sheets/MIT_2021.pdf
#
# 2014:
# Maintenance sheet date is written as 31.7.
# The sheet records HygroClip replacement:
# old serial 61012684 -> new serial 61180279.
# The year is taken from MIT_2014.pdf.
#
# 2015:
# On 11/8-2015 the MIT station was taken down because it was in very
# bad condition.
# On 13/8-2015 the station was revisited and the old TAS_U station
# was installed at MIT.
#
# 2021:
# Maintenance visits are explicitly dated 4/9-21 and 7/9-21.
# The standard Temperature / humidity assembly is marked N.
# The HygroClip in T/hum assembly is marked Y.
# This documents HygroClip activity but the extracted sheet does not
# provide a reliable replacement serial number for a new RH period.


[[sensor]]
name = "instrument_1"

# Source: MIT_2014.pdf
# Maintenance date field: 31.7
# Filename gives year 2014 -> 2014-07-31.
# Existing HygroClip serial: 61012684.
installation_date = "2014-07-31"

# Source: MIT_2015.pdf
# Date: 11/8-2015
# Notes explicitly state:
# "Station taken down."
decommission_date = "2015-08-11"

instrument_type = "Rotronic/HygroClip"
serial_number = "61180279"
source_file = "maintenance sheets/MIT_2014.pdf; maintenance sheets/MIT_2015.pdf"
parsing_confidence = "exact_maintenance_sheet_date"


[[sensor]]
name = "instrument_2"

# Source: MIT_2015.pdf
# Date: 13/8-2015
# Notes explicitly state:
# "Visit again"
# "Set up old TAS_U station"
installation_date = "2015-08-13"

# Source: MIT_2021.pdf
# Maintenance visits: 4/9-21 and 7/9-21.
# Temperature / humidity assembly = N.
# HygroClip in T/hum assembly = Y.
# Exact HygroClip replacement date within the two visits is not explicit,
# therefore 2021-09-04 is not used as a new boundary here.
decommission_date = "NA"

instrument_type = "Rotronic/HygroClip"
serial_number = "NA"
source_file = "maintenance sheets/MIT_2015.pdf; maintenance sheets/MIT_2021.pdf"
parsing_confidence = "2015_installation_exact; 2021_HygroClip_activity_documented_but_replacement_boundary_unresolved"