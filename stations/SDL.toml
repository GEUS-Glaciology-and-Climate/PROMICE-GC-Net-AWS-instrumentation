# First-draft instrument database for SDL
#
# Sources reviewed:
# - maintenance sheets/SDL_2021.pdf
# - maintenance sheets/SDL_2021_2.pdf
# - maintenance sheets/SDL_2022.pdf
# - maintenance sheets/SDL_2023.pdf
# - maintenance sheets/SDL_2023_2.pdf
# - maintenance sheets/SDL_2024.pdf
# - maintenance sheets/SDL_2025.pdf
# - maintenance sheets/SDL_2025_2.jpg
# - maintenance sheets/SDL_2025_3.jpg
# - maintenance sheets/SDL_2026.docx
#
# 2022:
# SDL_2021_2.pdf contains a maintenance/installation record dated
# 14 June 2022, despite the 2021 year in the filename.
#
# The separate SDL_2022 maintenance sheet does not create an RH boundary.
# Temperature/humidity assembly upper: Replaced = N
# Temperature/humidity assembly lower: Replaced = N
#
# 2023:
# Maintenance date = 15 JUN 2023.
# Both upper and lower temperature/humidity assemblies were replaced.
#
# 2024:
# Maintenance date = 24/5-2024.
# Both upper and lower temperature/humidity assemblies were replaced.
#
# 2025:
# Maintenance date = 20 May 2025.
# Both upper and lower Lufft assemblies are marked replaced.
#
# 2026:
# Maintenance date = 07-05-2026.
# Lufft upper: Replace = Yes
# Lufft lower: Replace = Yes

[[sensor]]
name = "instrument_1"

# The reviewed 2021 documentation does not provide a reliably readable
# exact RH installation date.
#
# The 14 June date in SDL_2021_2.pdf belongs to 2022, not 2021.
# Therefore, the existing filename-year fallback is retained.
installation_date = "2021-07-01"

# Source: SDL_2023.pdf / SDL_2023_2.pdf
# Date: 15 JUN 2023
# Upper T/RH assembly: Replaced = Y
# Lower T/RH assembly: Replaced = Y
decommission_date = "2023-06-15"

instrument_type = "Temperature/humidity assembly"
serial_number = "NA"
source_file = "maintenance sheets/SDL_2021.pdf; maintenance sheets/SDL_2021_2.pdf; maintenance sheets/SDL_2022.pdf"
parsing_confidence = "installation_filename_year_only_review_required; exact_decommission_date"


[[sensor]]
name = "instrument_2"

# Source: SDL_2023.pdf / SDL_2023_2.pdf
# Date: 15 JUN 2023
# Upper T/RH assembly: Shipped = Y, Replaced = Y
# Lower T/RH assembly: Shipped = Y, Replaced = Y
installation_date = "2023-06-15"

# Source: SDL_2024.pdf
# Date: 24/5-2024
# Upper T/RH assembly: Shipped = Y, Replaced = Y
# Lower T/RH assembly: Shipped = Y, Replaced = Y
decommission_date = "2024-05-24"

instrument_type = "Temperature/humidity assembly"
serial_number = "NA"
source_file = "maintenance sheets/SDL_2023.pdf; maintenance sheets/SDL_2023_2.pdf"
parsing_confidence = "exact_maintenance_sheet_date"


[[sensor]]
name = "instrument_3"

# Source: SDL_2024.pdf
